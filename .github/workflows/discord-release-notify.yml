name: Build and notify Discord

# Builds the shaded jar on every push to main, publishes it as a GitHub Release asset, and posts a
# rich embed release announcement to Discord — matching the ZeroG Network NeoEssentials-Dashboard
# release-message format. Runs on every push to main (not on tags/releases) per project decision.
#
# This is the "release announcement" webhook only (DISCORD_WEBHOOK_URL_2). Raw GitHub activity
# (commits/PRs/issues/releases) is handled separately by a native GitHub repo webhook pointed at
# Discord's own /github-formatted endpoint — no Actions code involved for that one.

on:
  push:
    branches: [main]
  # The push trigger above is unreliable on this org's repos (mirrors the same issue seen on
  # NeoEssentials) — workflow_dispatch lets a push be followed by manually firing the build
  # (`gh workflow run "Build and notify Discord" --ref main`) instead of hoping push fires it.
  workflow_dispatch: {}

# If several commits land on main in quick succession, cancel any build still running for an
# older commit instead of letting every push finish its own release + Discord post — otherwise
# a burst of pushes spams the channel with one embed per commit.
concurrency:
  group: build-and-notify-main
  cancel-in-progress: true

permissions:
  contents: write # needed to create the GitHub Release and upload its asset

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build shaded jar
        run: |
          chmod +x ./gradlew
          ./gradlew shadowJar --no-daemon

      - name: Package release jar
        id: package
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          JAR_PATH=$(find build/libs -name "*-all.jar" | head -n1)
          JAR_NAME="StellarServerForge_v${SHORT_SHA}.jar"

          mkdir -p dist
          cp "$JAR_PATH" "dist/${JAR_NAME}"

          SIZE_BYTES=$(stat -c%s "dist/${JAR_NAME}")
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", $SIZE_BYTES / 1048576 }")

          {
            echo "short_sha=$SHORT_SHA"
            echo "jar_name=$JAR_NAME"
            echo "jar_path=dist/${JAR_NAME}"
            echo "size_mb=$SIZE_MB"
          } >> "$GITHUB_OUTPUT"

      - name: Extract latest changelog entry
        id: changelog
        run: |
          # Grabs everything under the first dated "## " heading in CHANGELOG.md (skipping the
          # leading "## Unreleased" section if it's empty) so release notes track what's actually
          # documented there, instead of a generic "automated build" message.
          NOTES=$(awk '
            /^## Unreleased/ { in_unreleased=1; next }
            /^## / { if (in_unreleased && !collected) { in_unreleased=0 } else if (collected) { exit } }
            in_unreleased && NF { print; collected=1; next }
            !in_unreleased && /^## / { heading=1; next }
            heading { print; collected=1 }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="No changelog entry recorded for this build."
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          JAR_PATH: ${{ steps.package.outputs.jar_path }}
          CHANGELOG_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          # CHANGELOG_NOTES is passed as an env var (not interpolated into the script text) so its
          # content can't be interpreted as shell/workflow syntax.
          {
            echo "Automated build from commit ${SHORT_SHA} on main."
            echo ""
            echo "$CHANGELOG_NOTES"
          } > release-notes.md
          gh release create "build-${SHORT_SHA}" \
            "${JAR_PATH}" \
            --title "StellarServerForge ${SHORT_SHA}" \
            --notes-file release-notes.md

      - name: Notify Discord (embed)
        env:
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          JAR_NAME: ${{ steps.package.outputs.jar_name }}
          SIZE_MB: ${{ steps.package.outputs.size_mb }}
        run: |
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/build-${SHORT_SHA}/${JAR_NAME}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          PAYLOAD=$(jq -n \
            --arg sha "$SHORT_SHA" \
            --arg jar "$JAR_NAME" \
            --arg size "$SIZE_MB" \
            --arg url "$ASSET_URL" \
            --arg ts "$TIMESTAMP" \
            '{
              embeds: [
                {
                  title: "🆕 New Release",
                  color: 9536729,
                  fields: [
                    { name: "Branch", value: "`main`", inline: true },
                    { name: "StellarServerForge", value: ("`" + $sha + "`"), inline: true },
                    { name: $jar, value: ($size + " MB • [Download](" + $url + ")"), inline: false }
                  ],
                  timestamp: $ts
                }
              ]
            }')

          curl -sf -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL_2" \
            || echo "::warning::Discord release-embed webhook post failed"
