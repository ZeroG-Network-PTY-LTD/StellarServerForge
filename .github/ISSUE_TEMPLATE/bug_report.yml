name: 🐛 Bug Report
description: Report a bug or unexpected behavior in StellarServerForge
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below so it can be reproduced quickly.

  - type: input
    id: app-version
    attributes:
      label: StellarServerForge Version
      description: Shown in the app's title bar or About dialog.
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Server Loader
      description: Which loader were you setting up or managing when this happened?
      options:
        - Forge
        - NeoForge
        - Fabric
        - Quilt
        - Vanilla
        - Not loader-specific
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open StellarServerForge
        2. Select '...'
        3. Click '...'
        4. Error occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste any relevant output from the app's log file or console.
        Use pastebin/gist if the log is very large.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I am using the latest version of StellarServerForge.
          required: true
        - label: I have searched existing issues to avoid duplicates.
          required: true
